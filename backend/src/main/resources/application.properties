spring.datasource.url=jdbc:h2:mem:ziggizdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
# Safety net for any association not covered by a repository entity graph.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=surfco-secret-key-that-is-long-enough-for-hmac-sha256
jwt.expiration-ms=86400000

# YouCan Pay (Morocco) — fill these from the dashboard when the key is available.
payment.youcanpay.private-key=${YOUCANPAY_PRIVATE_KEY:}
payment.youcanpay.public-key=${YOUCANPAY_PUBLIC_KEY:}
payment.youcanpay.base-url=${YOUCANPAY_BASE_URL:https://youcanpay.com}
payment.youcanpay.success-url=${YOUCANPAY_SUCCESS_URL:http://localhost:5173/reservation?payment=success}
payment.youcanpay.error-url=${YOUCANPAY_ERROR_URL:http://localhost:5173/reservation?payment=error}
payment.youcanpay.sandbox=${YOUCANPAY_SANDBOX:false}

