name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  MAVEN_OPTS: '-Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository'

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziggiz-backend
          path: backend/target/*.jar
          retention-days: 5

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_SERVICE_CONNECTION }}

      - name: ACR login
        uses: azure/docker-login@v1
        with:
          registry-name: ${{ secrets.ACR_NAME }}

      - name: Build and push backend image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ziggiz-backend:latest \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            backend/

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/ziggiz-backend:latest \
            --env-vars \
              SPRING_DATASOURCE_URL="${{ secrets.AZURE_SQL_SERVER_URL }}" \
              SPRING_DATASOURCE_USERNAME="${{ secrets.AZURE_SQL_USERNAME }}" \
              SPRING_DATASOURCE_PASSWORD="${{ secrets.AZURE_SQL_PASSWORD }}" \
              SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT="org.hibernate.dialect.SQLServerDialect" \
              SPRING_H2_CONSOLE_ENABLED="false" \
              YOUCANPAY_PRIVATE_KEY="${{ secrets.YOUCANPAY_PRIVATE_KEY }}" \
              YOUCANPAY_PUBLIC_KEY="${{ secrets.YOUCANPAY_PUBLIC_KEY }}" \
              YOUCANPAY_SUCCESS_URL="${{ secrets.YOUCANPAY_SUCCESS_URL }}" \
              YOUCANPAY_ERROR_URL="${{ secrets.YOUCANPAY_ERROR_URL }}" \
              YOUCANPAY_SANDBOX="false"
